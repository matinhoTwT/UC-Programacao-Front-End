<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Países - Exercícios</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			padding: 2rem;
			margin: 0;
		}

		h1 {
			text-align: center;
		}

		nav {
			display: flex;
			justify-content: center;
			gap: 0.5rem;
			margin: 1.5rem 0 2rem;
		}

		nav button {
			padding: 0.6rem 1.2rem;
			border: 1px solid #333;
			background: #fff;
			border-radius: 6px;
			cursor: pointer;
			font-size: 1rem;
		}

		nav button.ativo {
			background: #333;
			color: #fff;
		}

		.exercicio {
			display: none;
		}

		.exercicio.ativo {
			display: block;
		}

		.countries {
			display: flex;
			flex-wrap: wrap;
			gap: 0.5rem;
		}

		.countries div,
		.countries article {
			border: 1px solid #ccc;
			border-radius: 6px;
			padding: 0.5rem 0.75rem;
		}

		.countries article {
			width: 220px;
		}

		.countries img {
			display: block;
			margin-bottom: 0.4rem;
		}

		.countries dl {
			margin: 0;
			display: grid;
			grid-template-columns: auto 1fr;
			gap: 0.2rem 0.5rem;
		}

		.countries dt {
			font-weight: bold;
		}

		.countries dd {
			margin: 0;
		}
	</style>
</head>
<body>
	<h1>Países</h1>

	<nav>
		<button id="btn1" class="ativo" onclick="mostrarExercicio(1)">Exercício 1</button>
		<button id="btn2" onclick="mostrarExercicio(2)">Exercício 2</button>
		<button id="btn3" onclick="mostrarExercicio(3)">Exercício 3</button>
		<button id="btn4" onclick="mostrarExercicio(4)">Exercício 4</button>
		<button id="btn5" onclick="mostrarExercicio(5)">Exercício 5</button>
	</nav>

	<section id="exercicio1" class="exercicio ativo">
		<h2>Exercício 1 - Lista de países</h2>
		<section class="countries" id="ex1"></section>
	</section>

	<section id="exercicio2" class="exercicio">
		<h2>Exercício 2 - Lista de países com cor</h2>
		<section class="countries" id="ex2"></section>
	</section>

	<section id="exercicio3" class="exercicio">
		<h2>Exercício 3 - Lista de países com detalhes e bandeiras</h2>
		<section class="countries" id="ex3"></section>
	</section>

	<section id="exercicio4" class="exercicio">
		<h2>Exercício 4 - Filtro de continentes</h2>
		<p>Continentes filtrados: <strong id="continentesTexto"></strong></p>
		<section class="countries" id="ex4"></section>
	</section>

	<section id="exercicio5" class="exercicio">
		<h2>Exercício 5 - Filtro de moeda</h2>
		<p>Moeda filtrada: <strong>Dólar dos Estados Unidos</strong></p>
		<section class="countries" id="ex5"></section>
	</section>

	<script>
		function mostrarExercicio(numero) {
			document.querySelectorAll(".exercicio").forEach(function (secao) {
				secao.classList.remove("ativo");
			});
			document.querySelectorAll("nav button").forEach(function (botao) {
				botao.classList.remove("ativo");
			});

			document.getElementById("exercicio" + numero).classList.add("ativo");
			document.getElementById("btn" + numero).classList.add("ativo");
		}

		async function carregarArrayDeCountries(caminhoArquivo) {
			const resposta = await fetch(caminhoArquivo);
			const textoDoArquivo = await resposta.text();

			const funcaoIsolada = new Function(`${textoDoArquivo}\nreturn countries;`);
			return funcaoIsolada();
		}

		async function exibirExercicio1() {
			const countries = await carregarArrayDeCountries("countries.js");
			const container1 = document.getElementById("ex1");

			countries.forEach(function (nomePais) {
				const div = document.createElement("div");

				const titulo = document.createElement("h3");
				titulo.textContent = nomePais;

				div.appendChild(titulo);
				container1.appendChild(div);
			});
		}

		async function exibirExercicio2() {
			const countries = await carregarArrayDeCountries("countries-colors.js");
			const container2 = document.getElementById("ex2");

			countries.forEach(function (pais) {
				const div = document.createElement("div");
				div.style.backgroundColor = pais.cor;

				const titulo = document.createElement("h3");
				titulo.textContent = pais.nome;

				div.appendChild(titulo);
				container2.appendChild(div);
			});
		}

		async function exibirExercicio3() {
			const countries = await carregarArrayDeCountries("countries-api.js");
			const container3 = document.getElementById("ex3");

			countries.forEach(function (pais) {
				const codigoAlpha2 = pais.id["ISO-3166-1-ALPHA-2"];
				const sigla = pais.id["ISO-3166-1-ALPHA-3"];
				const nome = pais.nome.abreviado;
				const regiao = pais.localizacao?.regiao?.nome ?? "Não informado";
				const capital = pais.governo?.capital?.nome ?? "Não informado";

				const artigo = document.createElement("article");

				const bandeira = document.createElement("img");
				bandeira.src = "https://flagcdn.com/w80/" + codigoAlpha2.toLowerCase() + ".png";
				bandeira.alt = "Bandeira de " + nome;
				bandeira.width = 80;

				const titulo = document.createElement("h3");
				titulo.textContent = nome;

				const detalhes = document.createElement("dl");
				detalhes.innerHTML =
					"<dt>Sigla</dt><dd>" + sigla + "</dd>" +
					"<dt>Região</dt><dd>" + regiao + "</dd>" +
					"<dt>Capital</dt><dd>" + capital + "</dd>";

				artigo.appendChild(bandeira);
				artigo.appendChild(titulo);
				artigo.appendChild(detalhes);
				container3.appendChild(artigo);
			});
		}

		const continentesFiltrados = ["América", "África"];

		function criarElementoPaisDetalhado(pais) {
			const codigoAlpha2 = pais.id["ISO-3166-1-ALPHA-2"];
			const sigla = pais.id["ISO-3166-1-ALPHA-3"];
			const nome = pais.nome.abreviado;
			const regiao = pais.localizacao?.regiao?.nome ?? "Não informado";
			const capital = pais.governo?.capital?.nome ?? "Não informado";

			const artigo = document.createElement("article");

			const bandeira = document.createElement("img");
			bandeira.src = "https://flagcdn.com/w80/" + codigoAlpha2.toLowerCase() + ".png";
			bandeira.alt = "Bandeira de " + nome;
			bandeira.width = 80;

			const titulo = document.createElement("h3");
			titulo.textContent = nome;

			const detalhes = document.createElement("dl");
			detalhes.innerHTML =
				"<dt>Sigla</dt><dd>" + sigla + "</dd>" +
				"<dt>Região</dt><dd>" + regiao + "</dd>" +
				"<dt>Capital</dt><dd>" + capital + "</dd>";

			artigo.appendChild(bandeira);
			artigo.appendChild(titulo);
			artigo.appendChild(detalhes);

			return artigo;
		}

		async function exibirExercicio4() {
			const countries = await carregarArrayDeCountries("countries-api.js");
			const container4 = document.getElementById("ex4");

			document.getElementById("continentesTexto").textContent = continentesFiltrados.join(", ");

			// Filtra só os países cuja região está na lista de continentes
			const paisesFiltrados = countries.filter(function (pais) {
				const regiao = pais.localizacao?.regiao?.nome;
				return continentesFiltrados.includes(regiao);
			});

			paisesFiltrados.forEach(function (pais) {
				container4.appendChild(criarElementoPaisDetalhado(pais));
			});
		}

		async function exibirExercicio5() {
			const countries = await carregarArrayDeCountries("countries-api.js");
			const container5 = document.getElementById("ex5");

			// Filtra os países que possuem a moeda "Dólar dos Estados Unidos"
			const paisesFiltrados = countries.filter(function (pais) {
				const moedas = pais["unidades-monetarias"] ?? [];
				return moedas.some(function (moeda) {
					return moeda.nome === "Dólar dos Estados Unidos";
				});
			});

			paisesFiltrados.forEach(function (pais) {
				container5.appendChild(criarElementoPaisDetalhado(pais));
			});
		}

		// Executa os cinco exercícios ao carregar a página
		exibirExercicio1();
		exibirExercicio2();
		exibirExercicio3();
		exibirExercicio4();
		exibirExercicio5();
	</script>
</body>
</html>
