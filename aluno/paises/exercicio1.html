<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Exercício 1 - Lista de países</title>
	<style>
		body { font-family: Arial, sans-serif; padding: 2rem; }
		.countries { display: flex; flex-wrap: wrap; gap: 0.5rem; }
		.countries div {
			border: 1px solid #ccc;
			border-radius: 6px;
			padding: 0.5rem 0.75rem;
		}
	</style>
</head>
<body>
	<h1>Exercício 1 - Lista de países</h1>

	<section class="countries" id="ex1"></section>

	<script src="countries.js"></script>
	<script>
		const container1 = document.getElementById("ex1");

		countries.forEach(function (nomePais) {
			
			const div = document.createElement("div");

			const titulo = document.createElement("h3");
			titulo.textContent = nomePais;
 
			div.appendChild(titulo);

			container1.appendChild(div);
		});
	</script>
</body>
</html>
